name: Game covers and legacy retirement

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scalia-production-connection
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
      - name: Publish covers and retire only the named legacy game
        env:
          GH_TOKEN: ${{ github.token }}
          SCALIA_STATE_KEY: ${{ secrets.SCALIA_STATE_KEY }}
          MAINTENANCE_REPORT: ${{ runner.temp }}/cover-maintenance.json
        run: node scripts/maintain-game-covers.mjs
      - name: Save maintenance receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cover-maintenance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cover-maintenance.json
          if-no-files-found: warn
          retention-days: 30
